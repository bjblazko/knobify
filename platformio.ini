; PlatformIO project configuration for knobify.
;
; `esp32-s3` targets the board's primary ESP32-S3R8 MCU. There is no
; PlatformIO board definition specific to the Waveshare
; ESP32-S3-Knob-Touch-LCD-1.8, so this uses the closest matching generic
; preset: `4d_systems_esp32s3_gen4_r8n16` ("R8N16" = 8MB octal PSRAM, 16MB
; flash, matching this board's ESP32-S3R8 chip exactly). This matters
; beyond labeling: switching to it (from the earlier `esp32-s3-devkitc-1`,
; whose own board definition is explicitly labeled "No PSRAM") fixed two
; real bugs found flashing actual hardware on 2026-09-11 --
; `board_build.arduino.memory_type = qio_opi` is the setting that
; actually configures octal-PSRAM line mode correctly (a manual
; `psram_type = opi` override on the No-PSRAM preset was not sufficient:
; PSRAM ID reads failed on real hardware), and this preset also sets
; `ARDUINO_USB_CDC_ON_BOOT=1`, without which `Serial` binds to
; unconnected physical UART0 pins instead of the native USB-JTAG port
; this board is actually flashed/monitored through. See
; docs/adr/0001-language-and-framework-choice.md and
; docs/adr/0004-navigation-library-and-index-architecture.md.
;
; `native` runs host-side unit tests (Unity) with no board involved —
; see docs/adr/0003-testing-strategy.md.

[env:esp32-s3]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
; Pinned to LVGL v8.3.x (not v9) to match Waveshare's own official demo
; for this board, whose ST77916 QSPI init sequence this project's display
; driver ports (see device.md, lib/drivers-display/St77916InitOps.h).
; ESP32-audioI2S pinned to a specific release for reproducibility (ADR
; 0001). The display itself uses Arduino_GFX (its Arduino_ESP32QSPI bus
; class) rather than ESP-IDF's esp_lcd_panel_io_spi: on real hardware,
; esp_lcd_panel_io_spi's QSPI (4-line) transactions never actually
; updated the physical panel on the ESP-IDF 4.4.x bundled with this
; platform version (7.1.3, current as of 2026-09-11) -- that API's
; quad/octal line support was added in a later ESP-IDF than this
; platform bundles. Arduino_GFX implements QSPI itself directly against
; spi_master, which should sidestep that limitation -- pending
; confirmation on hardware. Pinned to v1.4.9 specifically: newer releases
; (v1.5+) require esp32-hal-periman.h, an Arduino-ESP32 3.x/ESP-IDF 5.x
; header not present in this project's bundled 2.x-era core -- v1.4.9 is
; the newest release that still supports it. That version's own
; Arduino_ST77916 class doesn't accept a custom init table though (added
; later), so this project vendors its own minimal equivalent
; (lib/drivers-display/KnobSt77916.h) using this library's still-stable
; Arduino_TFT/Arduino_DataBus base classes.
; JPEGDEC decodes cover art (ID3/MP4 embedded pictures and folder
; cover.jpg/cover.jpeg files) to RGB565, baseline and progressive (the
; latter from DC coefficients at 1/8 scale, ADR 0016) -- used only when a
; cover is first cached (lib/drivers-jpeg/JpegDecAdapter.h, via
; CoverArtCache), never during playback: covers are decoded once and
; cached to SD, so LVGL's own image decoders (all disabled in lv_conf.h)
; are never needed. Pinned to a specific release for reproducibility,
; matching this project's other lib_deps.
lib_deps =
    lvgl/lvgl@^8.3.11
    esphome/ESP32-audioI2S@2.3.0
    moononournation/GFX Library for Arduino@1.4.9
    bitbank2/JPEGDEC@1.8.2
; TinyUSB instead of the S3's built-in USB-Serial-JTAG (ARDUINO_USB_MODE=0),
; for the USB drive (ADR 0016); Serial stays on USB as a TinyUSB CDC port.
; Flashing then needs a 1200-baud touch to reach the ROM bootloader, which
; scripts/flash-primary-mcu.sh does.
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -std=gnu++17
    -DARDUINO_USB_MODE=0
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_MODE=1

[env:native]
platform = native
build_flags =
    -std=c++17
