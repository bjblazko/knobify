; PlatformIO project configuration for knobify.
;
; `esp32-s3` targets the board's primary ESP32-S3R8 MCU. There is no
; PlatformIO board definition specific to the Waveshare
; ESP32-S3-Knob-Touch-LCD-1.8, so this starts from the generic
; esp32-s3-devkitc-1 board with build flags matching this board's actual
; memory (8MB PSRAM / 16MB flash) — see docs/adr/0001-language-and-framework-choice.md.
; Pin mappings and display/touch/audio driver specifics are not yet
; configured; that's next session's work.
;
; `native` runs host-side unit tests (Unity) with no board involved —
; see docs/adr/0003-testing-strategy.md.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Pinned to LVGL v8.3.x (not v9) to match Waveshare's own official demo
; for this board, whose ST77916 QSPI init/driver code this project's
; display driver is expected to port from -- see device.md. ESP32-audioI2S
; pinned to a specific release for reproducibility (ADR 0001).
lib_deps =
    lvgl/lvgl@^8.3.11
    esphome/ESP32-audioI2S@2.3.0
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -std=gnu++17
build_unflags =
    -std=gnu++11

[env:native]
platform = native
build_flags =
    -std=c++17
